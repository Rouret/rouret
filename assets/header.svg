<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"><title>Lucas Rouret, software engineer</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B12"/><stop offset="1" stop-color="#13111F"/></linearGradient><linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#A5B4FC"/></linearGradient><filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="70"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05"/></pattern><clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath><clipPath id="typing"><rect x="80" y="168" height="44" width="0"><animate attributeName="width" from="0" to="400" begin="0.4s" dur="2s" fill="freeze"/></rect></clipPath></defs><style>.sans{font-family:ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}.orbA{animation:driftA 14s ease-in-out infinite alternate}.orbB{animation:driftB 18s ease-in-out infinite alternate}@keyframes driftA{to{transform:translate(160px,60px)}}@keyframes driftB{to{transform:translate(-180px,-50px)}}.caret{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.word{opacity:0;transform-box:fill-box;animation:cycle 12s infinite}.w2{animation-delay:3s}.w3{animation-delay:6s}.w4{animation-delay:9s}@keyframes cycle{0%{opacity:0;transform:translateY(14px)}4%{opacity:1;transform:translateY(0)}21%{opacity:1;transform:translateY(0)}25%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.w1{opacity:1}}</style><g clip-path="url(#frame)"><rect width="1200" height="400" fill="url(#bg)"/><g filter="url(#blur)"><circle class="orbA" cx="260" cy="70" r="160" fill="#6366F1" opacity="0.35"/><circle class="orbB" cx="1010" cy="340" r="180" fill="#22D3EE" opacity="0.22"/></g><rect width="1200" height="400" fill="url(#grid)"/><g fill="none" stroke="#FFFFFF" stroke-opacity="0.09"><circle cx="970" cy="200" r="60"/><circle cx="970" cy="200" r="110"/><circle cx="970" cy="200" r="160"/></g><circle cx="970" cy="200" r="24" fill="#A5B4FC" opacity="0.15"/><circle cx="970" cy="200" r="8" fill="#A5B4FC"/><g><circle cx="1030" cy="200" r="5" fill="#A5B4FC"/><animateTransform attributeName="transform" type="rotate" from="0 970 200" to="360 970 200" dur="8s" repeatCount="indefinite"/></g><g><circle cx="970" cy="90" r="6" fill="#22D3EE"/><animateTransform attributeName="transform" type="rotate" from="0 970 200" to="360 970 200" dur="14s" repeatCount="indefinite"/></g><g><circle cx="810" cy="200" r="4" fill="#F472B6"/><animateTransform attributeName="transform" type="rotate" from="360 970 200" to="0 970 200" dur="22s" repeatCount="indefinite"/></g><text class="sans" x="80" y="146" font-size="72" font-weight="700" fill="url(#name)">Lucas Rouret</text><text class="mono" x="80" y="200" font-size="24" fill="#A1A1AA" textLength="390" clip-path="url(#typing)">&gt; software engineer, France</text><rect class="caret" x="80" y="179" width="12" height="26" fill="#A5B4FC"><animate attributeName="x" from="80" to="478" begin="0.4s" dur="2s" fill="freeze"/></rect><text class="mono" x="80" y="268" font-size="14" letter-spacing="2" fill="#71717A">CURRENTLY SHIPPING</text><g class="sans" font-size="34" font-weight="600" fill="#FFFFFF"><text class="word w1" x="80" y="314">Mobile apps people actually use</text><text class="word w2" x="80" y="314">Weather engines for France</text><text class="word w3" x="80" y="314">CS2 replays, built in Rust</text><text class="word w4" x="80" y="314">Fixes in the Elysia core</text></g></g></svg>
